<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Notes — Tomato Atelier</title><style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Noto+Sans+SC:wght@400;700&display=swap');:root{--c:#f7f0dd;--r:#e53935;--g:#1d5936;--b:#2d7dcb;--i:#111}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font-family:'Noto Sans SC',sans-serif}.wrap{width:min(1100px,calc(100% - 40px));margin:auto}.nav{display:flex;justify-content:space-between;padding:22px 0;border-bottom:2px solid var(--i);font:700 12px Archivo;letter-spacing:.12em;text-transform:uppercase}.nav a{color:inherit;text-decoration:none}.hero{padding:85px 0 45px}.ey{font:700 12px Archivo;letter-spacing:.2em;color:var(--g)}h1{font:900 clamp(66px,13vw,150px)/.8 Archivo;letter-spacing:-.1em;text-transform:uppercase;margin:24px 0}h1 span{color:var(--r);display:block;margin-left:15vw}.lead{max-width:500px;line-height:1.7}.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:30px 0 90px}.step{border:2px solid var(--i);padding:18px;min-height:320px;position:relative;overflow:hidden}.step:nth-child(2){background:var(--g);color:#fff}.step:nth-child(3){background:var(--b);color:#fff}.step h2{font:900 42px/.9 Archivo;letter-spacing:-.08em;text-transform:uppercase;margin:90px 0 16px}.step p{line-height:1.6;font-size:14px}.circle{position:absolute;width:170px;height:170px;border-radius:50%;right:-35px;bottom:-40px;background:var(--r);box-shadow:inset -18px -18px #a81728}.step:nth-child(2) .circle{background:#f0ba42}.step:nth-child(3) .circle{background:#ef5543}.quote{border-top:2px solid var(--i);border-bottom:2px solid var(--i);padding:30px 0;font:900 clamp(34px,6vw,70px)/.9 Archivo;letter-spacing:-.08em;text-transform:uppercase}.reveal{opacity:0;transform:translateY(35px);transition:.7s}.reveal.visible{opacity:1;transform:none}@media(max-width:700px){.timeline{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><nav class="nav"><a href="pages.html">● Tomato Atelier</a><a href="index.html">Home ↗</a></nav><main class="hero"><div class="ey">01 / field notes</div><h1>From sun<br><span>to plate</span></h1><p class="lead">番茄不是静态的商品，而是一段会变色、会成熟、会留下气味的旅程。向下滚动，逐帧打开它的品牌故事。</p></main><section class="timeline"><article class="step reveal"><small>01 — GROW</small><h2>Sun<br>light</h2><p>每天六小时的光，让果实从绿色开始积累甜度。</p><i class="circle"></i></article><article class="step reveal"><small>02 — RIPEN</small><h2>Red<br>matter</h2><p>颜色变深，果肉变软，酸度和香气找到平衡。</p><i class="circle"></i></article><article class="step reveal"><small>03 — TASTE</small><h2>Good<br>ending</h2><p>切开、撒盐、入口。品牌故事在这一刻完成。</p><i class="circle"></i></article></section><div class="quote reveal">A tomato is a tiny sun you can hold.</div></div><script>const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('visible')),{threshold:.15});document.querySelectorAll('.reveal').forEach(x=>io.observe(x));</script></body></html>
