<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visit — Tomato Atelier</title><style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Noto+Sans+SC:wght@400;700&display=swap');:root{--c:#f7f0dd;--r:#e53935;--g:#1d5936;--i:#111}*{box-sizing:border-box}body{margin:0;background:var(--c);font-family:'Noto Sans SC',sans-serif;color:var(--i)}.wrap{width:min(940px,calc(100% - 40px));margin:auto}.nav{display:flex;justify-content:space-between;padding:22px 0;border-bottom:2px solid var(--i);font:700 12px Archivo;letter-spacing:.12em;text-transform:uppercase}.nav a{color:inherit;text-decoration:none}.hero{padding:80px 0 35px}.ey{font:700 12px Archivo;letter-spacing:.2em;color:var(--g)}h1{font:900 clamp(65px,13vw,145px)/.8 Archivo;letter-spacing:-.1em;text-transform:uppercase;margin:25px 0}h1 span{color:var(--r);display:block;margin-left:14vw}.box{background:var(--g);color:#fff;border:2px solid var(--i);padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:30px}.box h2{font:900 clamp(38px,6vw,70px)/.86 Archivo;letter-spacing:-.08em;text-transform:uppercase;margin:0 0 20px}.box p{line-height:1.7;color:#e5f0df}.form{display:grid;gap:14px}.form label{font:700 11px Archivo;letter-spacing:.12em;text-transform:uppercase}.form input,.form select{width:100%;padding:14px;border:2px solid #fff;background:transparent;color:#fff;font:inherit}.form option{color:#111}.submit{border:2px solid #fff;background:var(--r);color:#fff;padding:15px;font-weight:900;cursor:pointer}.result{display:none;margin-top:18px;background:#fff;color:#111;padding:15px;font-weight:700}.result.show{display:block}@media(max-width:700px){.box{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><nav class="nav"><a href="pages.html">● Tomato Atelier</a><a href="index.html">Home ↗</a></nav><main class="hero"><div class="ey">04 / visit the atelier</div><h1>Come<br><span>and taste</span></h1><section class="box"><div><h2>Make it<br>real.</h2><p>预约一场番茄品尝会，现场体验不同颜色、质地和风味的组合。</p></div><form class="form" id="form"><label>Name<input required name="name" placeholder="Your name"></label><label>Choose a mood<select name="mood"><option>Juicy red</option><option>Sun gold</option><option>Green & wild</option></select></label><label>Date<input required type="date" name="date"></label><button class="submit" type="submit">Request a tasting ↗</button><div class="result" id="result">收到！我们会带着一篮番茄和阳光联系你。</div></form></section></main></div><script>document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#result').classList.add('show')})</script></body></html>
